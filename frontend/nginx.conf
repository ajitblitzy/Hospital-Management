# =============================================================================
# Hospital Management System (HMS) - Frontend nginx configuration
# -----------------------------------------------------------------------------
# Serves the built React single-page application (the Vite `dist/` output)
# inside the frontend Docker image.
#
# DELIVERY MODEL
#   * This file is copied into the nginx image at:
#         /etc/nginx/conf.d/default.conf
#     Therefore it contains ONLY a `server { ... }` block. The surrounding
#     `http { ... }` and `events { ... }` contexts are provided by the stock
#     nginx base image (`/etc/nginx/nginx.conf`).
#   * The frontend `Dockerfile` copies the compiled SPA (`dist/`) into
#         /usr/share/nginx/html
#     and `EXPOSE`s port 3000.
#
# WHY A CUSTOM CONFIG?
#   The SPA uses client-side routing (React Router v6). Deep links and browser
#   refreshes on client routes (e.g. `/patients`, `/appointments/42`) must be
#   served the SPA shell (`index.html`) rather than a filesystem 404. The
#   `try_files ... /index.html` fallback below implements exactly that.
#
# PORT
#   Listens on 3000 to match the root `docker-compose.yml` mapping (`3000:3000`)
#   and the `Dockerfile` `EXPOSE 3000`. Port 80 is intentionally NOT used.
#
# SCOPE / NON-GOALS
#   * NO TLS/HTTPS here - TLS is terminated upstream at the ingress / API
#     gateway layer; this container serves plain HTTP on the cluster network.
#   * NO `/api` reverse proxy - the browser calls the API gateway directly via
#     `VITE_API_BASE_URL` (baked in at build time). This server only serves
#     static SPA assets.
# =============================================================================

server {
    # ---------------------------------------------------------------- Listen ---
    # Plain HTTP on port 3000 (see the docker-compose `frontend` 3000:3000
    # mapping and the Dockerfile `EXPOSE 3000`). IPv4 only: the Docker bridge
    # network does not guarantee IPv6, so binding `[::]:3000` is intentionally
    # avoided to prevent runtime "Address family not supported" bind failures.
    listen 3000;

    # Catch-all server name - this is the only virtual host in the image.
    server_name _;

    # ----------------------------------------------------------- Document root -
    # The Dockerfile copies the Vite build output (`dist/`) here.
    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------- Static file perf --
    # Efficient static delivery for the compiled SPA bundle.
    sendfile on;
    tcp_nopush on;

    # Do not leak the nginx version in the `Server` response header.
    server_tokens off;

    # -------------------------------------------------------------- Compression -
    # Compress text-based assets on the fly. Hashed JS/CSS bundles benefit the
    # most; already-compressed binary assets (images/fonts) are skipped.
    gzip on;
    gzip_vary on;                 # emit `Vary: Accept-Encoding` for caches/CDNs
    gzip_proxied any;             # compress even when behind the ingress proxy
    gzip_comp_level 6;            # balanced CPU cost vs. compression ratio
    gzip_min_length 1024;         # skip tiny payloads where overhead > gain
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml;
    # NOTE: `text/html` is always compressed by nginx when `gzip on;` and must
    # not (and need not) be listed in `gzip_types`.

    # ---------------------------------------------------------- Security headers
    # Applied server-wide with `always` so they are present on error responses
    # too. IMPORTANT nginx behaviour: an `add_header` inside a nested `location`
    # REPLACES (does not merge with) inherited headers, so every location that
    # declares its own headers below re-declares these security headers.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ------------------------------------------------------------- Health check -
    # Lightweight liveness/readiness endpoint used by the Dockerfile HEALTHCHECK
    # and Kubernetes probes. Returns a plain-text `ok` with HTTP 200. Access
    # logging is disabled to avoid flooding logs with probe traffic.
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # ---------------------------------------------------------- SPA shell (HTML)
    # `index.html` is the application shell. It must NOT be cached aggressively
    # so a new deployment (with freshly hashed asset references) is picked up on
    # the next request. This exact-match location also serves the internal
    # redirect produced by the `try_files ... /index.html` fallback below, so
    # the security headers are re-declared here to guarantee they are present on
    # every SPA (deep-link) HTML response.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # -------------------------------------------------------- Fingerprinted assets
    # Vite emits content-hashed files under `/assets/` (e.g. `index-a1b2c3d4.js`).
    # Because the filename changes whenever the content changes, these are safe
    # to cache "forever" and are marked `immutable`. A miss returns a hard 404
    # (no SPA fallback) so a stale/incorrect asset URL fails fast instead of
    # silently returning HTML.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # ------------------------------------------------------------- SPA fallback -
    # THE most important directive for client-side routing: try to serve the
    # requested file or directory, and if neither exists fall back to the SPA
    # shell so React Router can resolve the route on the client. This makes deep
    # links and browser refreshes (e.g. `/patients`) work. This block declares
    # no `add_header`, so it inherits the server-wide security headers above.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
