# ==============================================================================
# HMS Monitoring - Grafana Dashboards ConfigMap  (GENERATED - DO NOT HAND-EDIT)
# ------------------------------------------------------------------------------
# Bundles the three HMS Grafana dashboard definitions so Grafana's file-based
# dashboard provider can load them at runtime. Grounded in
# 05_Hospital_Management_QA_Testing_and_DevOps_Strategy.pdf ("Monitoring using
# Prometheus and Grafana") and 03_Hospital_Management_Technical_Architecture.pdf
# ("Containerization: Docker & Kubernetes"). Scoped to the "monitoring" namespace.
#
# SOURCE OF TRUTH: the dashboard JSON embedded below is copied VERBATIM from
#   infrastructure/monitoring/grafana/dashboards/
# (hms-overview.json, hms-services-health.json, hms-datastores.json). This
# ConfigMap DEPLOYS those files and MUST NOT diverge from them. Every panel
# targets the Prometheus datasource uid "prometheus" (must match the datasource
# declared in the grafana-datasources ConfigMap). Do NOT hand-edit the embedded
# JSON here - edit the source files under ../grafana/dashboards/ and regenerate.
#
# HOW IT IS CONSUMED: grafana-deployment.yaml mounts this ConfigMap at
#   /var/lib/grafana/dashboards
# which MUST equal the provider options.path declared in the OTHER ConfigMap
# grafana-dashboard-provider (grafana-provisioning-configmap.yaml). Each data-key
# name becomes a filename in that directory, so the ".json" extensions are kept
# for Grafana's file provider to discover them.
#
# REGENERATION (equivalent to this file; run from the repository root). Prefer the
# explicit per-file form so the provider config (dashboards.yml) is NOT pulled in:
#   kubectl create configmap grafana-dashboards \
#     --from-file=hms-overview.json=infrastructure/monitoring/grafana/dashboards/hms-overview.json \
#     --from-file=hms-services-health.json=infrastructure/monitoring/grafana/dashboards/hms-services-health.json \
#     --from-file=hms-datastores.json=infrastructure/monitoring/grafana/dashboards/hms-datastores.json \
#     -n monitoring --dry-run=client -o yaml
#
# The directory form below is a shortcut but ALSO picks up dashboards.yml:
#   kubectl create configmap grafana-dashboards \
#     --from-file=infrastructure/monitoring/grafana/dashboards/ \
#     -n monitoring --dry-run=client -o yaml
# If you use the directory form, delete the resulting "dashboards.yml" key - the
# provider config belongs in grafana-dashboard-provider, NOT in this ConfigMap.
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  # Consumed by grafana-deployment.yaml as a mounted volume; this name MUST stay
  # exactly "grafana-dashboards" so the Deployment's volume reference resolves.
  name: grafana-dashboards
  namespace: monitoring
  labels:
    # Kubernetes recommended common labels, matching the sibling monitoring
    # manifests under infrastructure/monitoring/kubernetes/.
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: hospital-management-system
    app.kubernetes.io/managed-by: kubectl
