# ==============================================================================
# HMS Monitoring — Grafana Admin Credentials Secret  (TEMPLATE / EXAMPLE ONLY)
# ------------------------------------------------------------------------------
# WARNING: TEMPLATE ONLY. This file intentionally contains PLACEHOLDER values
# (CHANGE_ME) — it is NOT a working credential and MUST NOT be applied as-is.
# NEVER substitute a real value here and commit it. Storing a live Grafana admin
# password in version control would violate the "Patient data privacy" risk area
# documented in 05_Hospital_Management_QA_Testing_and_DevOps_Strategy.pdf, which
# requires that real credentials are never checked into git.
#
# PURPOSE: supplies the Grafana admin login for the Prometheus + Grafana
# monitoring stack (doc 05: "Monitoring using Prometheus and Grafana"; doc 03,
# 03_Hospital_Management_Technical_Architecture.pdf: "Containerization: Docker &
# Kubernetes"). It is scoped to the dedicated "monitoring" namespace.
#
# DEPLOY-TIME OPTIONS (pick ONE — never apply this example file directly):
#   1) Copy + edit (declarative flow):
#        cp grafana-secret.example.yaml grafana-secret.yaml
#        # edit grafana-secret.yaml and set a strong GF_SECURITY_ADMIN_PASSWORD
#        kubectl apply -f grafana-secret.yaml
#      Keep grafana-secret.yaml OUT of git (it is git-ignored) so the real admin
#      credential is never committed.
#   2) Create imperatively (nothing is written to disk or git):
#        kubectl create secret generic grafana-admin -n monitoring \
#          --from-literal=GF_SECURITY_ADMIN_USER=admin \
#          --from-literal=GF_SECURITY_ADMIN_PASSWORD=<STRONG_PASSWORD>
#
# HOW IT IS CONSUMED: the Grafana Deployment (grafana-deployment.yaml) loads this
# resource by reference, not by value:
#        envFrom:
#          - secretRef:
#              name: grafana-admin
# Grafana automatically maps GF_<SECTION>_<KEY> environment variables onto its
# configuration, so GF_SECURITY_ADMIN_USER and GF_SECURITY_ADMIN_PASSWORD set the
# [security] admin_user / admin_password options with no additional wiring.
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  # Referenced by grafana-deployment.yaml via envFrom.secretRef.name; this value
  # MUST stay exactly "grafana-admin" so that reference keeps resolving.
  name: grafana-admin
  namespace: monitoring
  labels:
    # Kubernetes recommended common labels, matching the sibling HMS manifests
    # under infrastructure/kubernetes/ so tooling can identify and group them.
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: hospital-management-system
    app.kubernetes.io/managed-by: kubectl
type: Opaque
# stringData holds UTF-8 values as-is (Kubernetes base64-encodes them on apply),
# so the placeholders below stay human-readable and are obviously NOT real data.
stringData:
  # Grafana built-in admin username -> [security].admin_user
  GF_SECURITY_ADMIN_USER: "admin"
  # PLACEHOLDER admin password -> [security].admin_password. This MUST remain the
  # literal CHANGE_ME in the committed example; supply the real strong value only
  # at deploy time via one of the DEPLOY-TIME OPTIONS above.
  GF_SECURITY_ADMIN_PASSWORD: "CHANGE_ME"

  # ----------------------------------------------------------------------------
  # OPTIONAL — Alertmanager receiver credentials, deliberately kept COMMENTED OUT.
  # The active Alertmanager configuration ships with a placeholder webhook and
  # needs no live value, so none of the keys below are enabled. If you later wire
  # a real receiver, add the key to your git-ignored grafana-secret.yaml (or a
  # dedicated Alertmanager credential store) — never uncomment a real value here.
  # SLACK_WEBHOOK_URL: "CHANGE_ME"
  # SMTP_PASSWORD: "CHANGE_ME"
  # PAGERDUTY_ROUTING_KEY: "CHANGE_ME"
