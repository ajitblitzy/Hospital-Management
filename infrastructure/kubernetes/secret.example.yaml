# ==============================================================================
# HMS Application Secrets — hms-secrets  (TEMPLATE / EXAMPLE ONLY)
# ------------------------------------------------------------------------------
# WARNING: TEMPLATE ONLY. This file intentionally contains PLACEHOLDER values
# (CHANGE_ME) — it holds NO working credentials and MUST NOT be applied as-is.
# NEVER substitute a real value here and commit it. Committing a live database
# password, JWT signing secret, patient-data encryption key, or cloud
# credential to version control would violate the "Patient data privacy" risk
# area documented in 05_Hospital_Management_QA_Testing_and_DevOps_Strategy.pdf,
# which requires that real credentials are never checked into git. The filename
# is `secret.example.yaml` (not `secret.yaml`) specifically so it is obviously a
# template and is NOT applied to a cluster by accident.
#
# PURPOSE: declares every SENSITIVE runtime value for the Hospital Management
# System (HMS). Consumed by the backend microservice + frontend Deployments
# under infrastructure/kubernetes/ by REFERENCE (never by value):
#
#        envFrom:
#          - configMapRef:
#              name: hms-config      # non-secret config  (configmap.yaml)
#          - secretRef:
#              name: hms-secrets     # sensitive values   (this Secret)
#
# The keys below mirror 1:1 the SECRET variables in the root ../../.env.example.
# NON-secret settings (ports, hostnames, DB name/user, timeouts, AWS region, S3
# bucket, URLs, etc.) do NOT belong here — they live in the ConfigMap
# `hms-config` (configmap.yaml). Grounded in 03_Hospital_Management_Technical_
# Architecture.pdf (encrypted patient data at rest; JWT authentication).
#
# DEPLOY-TIME OPTIONS (pick ONE — never apply this example file directly):
#   1) Create imperatively from an env file (nothing real is written to git):
#        kubectl create secret generic hms-secrets -n hms \
#          --from-env-file=./secret.env
#      (keep ./secret.env OUT of git; it holds the real values)
#   2) External secret store (recommended for production): pull values from
#        AWS Secrets Manager / SSM Parameter Store, e.g. via the External
#        Secrets Operator, which materializes `hms-secrets` from the store.
#   3) Copy + edit (declarative flow):
#        cp secret.example.yaml secret.yaml
#        # edit secret.yaml and replace every CHANGE_ME with a real strong value
#        kubectl apply -f secret.yaml
#      Keep secret.yaml OUT of git (it is git-ignored) so real credentials are
#      never committed.
#
# CLOUD CREDENTIALS: PREFER EKS IAM Roles for Service Accounts (IRSA) over the
# static AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY below. When IRSA is used,
# omit those two keys entirely and let pods assume an IAM role instead.
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  # Referenced by the HMS Deployments via envFrom.secretRef.name; this value
  # MUST stay exactly "hms-secrets" so those references keep resolving.
  name: hms-secrets
  namespace: hms
  labels:
    # Kubernetes recommended common labels, applied consistently across every
    # HMS resource under infrastructure/kubernetes/ so tooling can group them.
    app.kubernetes.io/name: hms
    app.kubernetes.io/part-of: hospital-management-system
    app.kubernetes.io/managed-by: kubectl
type: Opaque
# stringData holds UTF-8 values as-is (Kubernetes base64-encodes them on apply),
# so the placeholders below stay human-readable and are obviously NOT real data.
# Every value MUST remain a placeholder in this committed template; supply real
# values only at deploy time via one of the DEPLOY-TIME OPTIONS above.
stringData:
  # PostgreSQL application-user password (pairs with POSTGRES_USER in hms-config).
  POSTGRES_PASSWORD: "CHANGE_ME"
  # Full PostgreSQL DSN. Host is the in-cluster Service name `postgres`; for a
  # managed datastore (e.g. Amazon RDS) swap `postgres:5432` for the RDS
  # endpoint host:port. Keep its credentials in sync with POSTGRES_PASSWORD.
  DATABASE_URL: "postgresql://hms_user:CHANGE_ME@postgres:5432/hms"
  # Redis auth password (host/port live in hms-config as REDIS_HOST/REDIS_PORT).
  REDIS_PASSWORD: "CHANGE_ME"
  # Secret used to SIGN short-lived JWT access tokens — use a long random value.
  JWT_SECRET: "CHANGE_ME"
  # Secret used to SIGN JWT refresh tokens — MUST differ from JWT_SECRET.
  JWT_REFRESH_SECRET: "CHANGE_ME"
  # Symmetric key for field-level encryption of sensitive patient data at rest
  # (doc 03) — use a 32-byte (256-bit) random key. Rotating it re-keys the data.
  DATA_ENCRYPTION_KEY: "CHANGE_ME"
  # SMTP account password / API key for transactional email (reminders, etc.).
  SMTP_PASSWORD: "CHANGE_ME"
  # API key / token for the SMS provider used for appointment reminders.
  SMS_API_KEY: "CHANGE_ME"
  # AWS access key ID for S3 uploads (patient ID documents). PREFER EKS IRSA
  # over static keys — see the CLOUD CREDENTIALS note in the header above.
  AWS_ACCESS_KEY_ID: "CHANGE_ME"
  # AWS secret access key — same IRSA preference as AWS_ACCESS_KEY_ID applies.
  AWS_SECRET_ACCESS_KEY: "CHANGE_ME"
