# HMS Patient Service — stable in-cluster ClusterIP endpoint for the Patient Registration
# microservice. The api-gateway reaches it at patient-service.hms.svc.cluster.local:4002
# (gateway route /api/patients). Load-balances across the patient-service Deployment's pods
# ("Load balancing for APIs" — 03_Hospital_Management_Technical_Architecture.pdf).
apiVersion: v1
kind: Service
metadata:
  name: patient-service
  namespace: hms
  labels:
    app.kubernetes.io/name: patient-service
    app.kubernetes.io/part-of: hospital-management-system
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: kubectl
spec:
  type: ClusterIP
  # Selector matches the Deployment's pod template identity label (deployment.yaml) so this
  # Service resolves the patient-service pods as its endpoints.
  selector:
    app.kubernetes.io/name: patient-service
  ports:
    - name: http
      port: 4002
      targetPort: 4002
      protocol: TCP
