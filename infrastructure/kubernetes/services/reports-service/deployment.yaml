# HMS Reports & Analytics service (reports-service) — Deployment.
# Read-only aggregation across services with asynchronous, Redis-backed report
# generation and caching (Reports & Analytics core module —
# 01_Hospital_Management_Product_Vision_and_Scope.pdf). The service is stateless
# (sessions/queues live in Redis) so it scales horizontally
# (03_Hospital_Management_Technical_Architecture.pdf — modular microservices,
# "Horizontal scaling using Kubernetes", "Asynchronous job processing"). Runs in the
# `hms` namespace behind the api-gateway (route /api/reports). HA: replicas: 2 (the
# HorizontalPodAutoscaler in hpa.yaml scales this Deployment between 2 and 10 pods).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reports-service
  namespace: hms
  labels:
    app.kubernetes.io/name: reports-service
    app.kubernetes.io/part-of: hospital-management-system
    app.kubernetes.io/component: reports-service
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: reports-service
      app.kubernetes.io/part-of: hospital-management-system
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reports-service
        app.kubernetes.io/part-of: hospital-management-system
        app.kubernetes.io/component: reports-service
        app.kubernetes.io/managed-by: kubectl
    spec:
      containers:
        - name: reports-service
          # Placeholder image reference ONLY. CI/CD (../../../.github/ workflows +
          # the image build/push in ../../docker/) substitutes the real Amazon ECR
          # URI and tag at deploy time (e.g. `kubectl set image` / `kustomize edit set image`).
          image: <ECR_REGISTRY>/hms-reports-service:<IMAGE_TAG>
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4009
              name: http
          # ALL runtime config + secrets are injected via the shared ConfigMap/Secret
          # (../../configmap.yaml -> hms-config, ../../secret.example.yaml -> hms-secrets).
          # The app binds REPORTS_SERVICE_PORT (=4009) from hms-config and reaches
          # PostgreSQL/Redis via the `postgres`/`redis` service DNS names (never localhost).
          # Never hardcode configuration or secrets in this manifest.
          envFrom:
            - configMapRef:
                name: hms-config
            - secretRef:
                name: hms-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 4009
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 4009
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
