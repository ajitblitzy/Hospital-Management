# HMS Appointment Service Deployment — module "Appointment Scheduling" (doc 01):
# doctor calendar management, online booking, schedule-conflict prevention and
# SMS/email reminders. Node.js/Express microservice fronted by the api-gateway
# (route /api/appointments). Stateless — sessions/queues and reminder jobs live in
# Redis (asynchronous job processing, doc 03) — so it scales horizontally
# ("Horizontal scaling using Kubernetes", doc 03; hpa.yaml scales this Deployment 2→10).
# Runs in the `hms` namespace. HA: replicas: 2.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: appointment-service
  namespace: hms
  labels:
    app.kubernetes.io/name: appointment-service
    app.kubernetes.io/part-of: hospital-management-system
    app.kubernetes.io/component: appointment-service
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: appointment-service
      app.kubernetes.io/part-of: hospital-management-system
  template:
    metadata:
      labels:
        app.kubernetes.io/name: appointment-service
        app.kubernetes.io/part-of: hospital-management-system
        app.kubernetes.io/component: appointment-service
        app.kubernetes.io/managed-by: kubectl
    spec:
      containers:
        - name: appointment-service
          # Placeholder image reference ONLY. CI/CD (../../../../.github/ workflows +
          # the image build/push in ../../../docker/) substitutes the real Amazon ECR
          # URI and tag at deploy time (e.g. `kubectl set image` / `kustomize edit set image`).
          image: <ECR_REGISTRY>/hms-appointment-service:<IMAGE_TAG>
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4003
              name: http
          # ALL runtime config + secrets are injected via the shared ConfigMap/Secret
          # (../../configmap.yaml -> hms-config, ../../secret.example.yaml -> hms-secrets).
          # The app binds APPOINTMENT_SERVICE_PORT (=4003) from hms-config; SMTP/SMS
          # reminder settings and DB/Redis credentials arrive the same way. Postgres/Redis
          # are reached via the `postgres`/`redis` service DNS (never localhost). Never
          # hardcode configuration or secrets in this manifest.
          envFrom:
            - configMapRef:
                name: hms-config
            - secretRef:
                name: hms-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 4003
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 4003
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
