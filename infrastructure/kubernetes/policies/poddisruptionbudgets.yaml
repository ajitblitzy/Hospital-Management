# =============================================================================
# HMS PodDisruptionBudgets — High Availability (namespace `hms`)
# -----------------------------------------------------------------------------
# Implements doc 05 (QA/Testing & DevOps Strategy) risk area "High availability
# requirements" and supports doc 03 "Horizontal scaling using Kubernetes".
#
# A PodDisruptionBudget limits VOLUNTARY disruptions (node drains, cluster
# upgrades, `kubectl drain`). `minAvailable: 1` guarantees at least one replica
# of each workload keeps serving while nodes are drained one at a time.
#
# IMPORTANT: minAvailable:1 assumes each Deployment runs >= 2 replicas
# (align with the HPA `minReplicas` under ../api-gateway/, ../services/,
# ../frontend/). With a single replica, minAvailable:1 will BLOCK voluntary
# evictions of that pod. For larger deployments, `maxUnavailable: 1` is an
# equivalent alternative that scales with replica count.
#
# Covers all 11 deployables (api-gateway + 9 backend services + frontend).
# Datastores (postgres/redis) are handled separately under ../datastores/.
#
# Selector/label contract (match the workload pod templates):
#   app.kubernetes.io/name: <component>
#   app.kubernetes.io/part-of: hospital-management-system
# =============================================================================

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  namespace: hms
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: hospital-management-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway

